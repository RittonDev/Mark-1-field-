# MaxxChamados — ambiente local completo.
#
#   docker compose up -d --build
#   docker compose exec api python -m app.seed      # dados de exemplo (usa SEED_PASSWORD)
#
#   Web        -> http://localhost:3001
#   API        -> http://localhost:8000/docs
#   PostgreSQL -> localhost:5433 (chamados / chamados)
#   Redis      -> localhost:6380
#
# Portas escolhidas para não colidir com o ambiente local do MaxxField (3000/5432/8080).
name: maxx-chamados

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: chamados
      POSTGRES_DB: chamados
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chamados"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://chamados:chamados@db:5432/chamados
      TEST_DATABASE_URL: postgresql+asyncpg://chamados:chamados@db:5432/chamados_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-troque-em-producao}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      MEDIA_ROOT: /data/media
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
        NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-}
        NEXT_PUBLIC_MAP_TILES_DARK_URL: ${NEXT_PUBLIC_MAP_TILES_DARK_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  media:
