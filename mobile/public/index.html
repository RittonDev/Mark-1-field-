<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Maxx Field</title>
    <meta name="description" content="App dos técnicos de campo da Maxx." />

    <!-- App instalável (PWA): Android pelo Chrome ("Instalar app") e iPhone pelo Safari ("Adicionar à Tela de Início"). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F9FAFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0E11" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maxx Field" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Maxx Field.</noscript>
    <div id="root"></div>
    <script>
      // Service worker (public/sw.js): guarda a casca do app para ele abrir sem internet depois da
      // primeira visita. Só no endereço publicado (https) ou num teste local fora do Metro: na
      // pré-visualização de desenvolvimento (porta 8081) ele não entra, para não guardar pacote velho.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var local = location.hostname === "localhost" || /\.localhost$/.test(location.hostname);
        if (location.port === "8081") return;
        if (location.protocol !== "https:" && !local) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      })();
    </script>
  </body>
</html>
