[project]
name = "maxxchamados-api"
version = "0.1.0"
description = "API de gestão de chamados de T.I. (FastAPI + PostgreSQL)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
# UP046: Page[T] continua com Generic[T] (forma documentada pelo Pydantic).
ignore = ["B008", "UP046"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
